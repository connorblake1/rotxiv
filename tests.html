<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>arXivrot tests</title>
  <style>
    body { font: 14px -apple-system, system-ui, sans-serif; background: #0b0b14; color: #f5f5f7; padding: 24px; max-width: 760px; margin: 0 auto; }
    h1 { font-size: 22px; }
    h1.pass { color: #22c55e; } h1.fail { color: #ef4444; }
    ul { list-style: none; padding: 0; }
    li { padding: 8px 12px; border-radius: 8px; margin-bottom: 6px; background: #14141f; }
    li.p { border-left: 3px solid #22c55e; }
    li.f { border-left: 3px solid #ef4444; }
    code { color: #fda4af; display: inline-block; margin-top: 4px; font-size: 12px; }
  </style>
</head>
<body>
  <div id="out">running…</div>
  <script type="module">
    import { run } from './js/tests.js';
    run(document.getElementById('out')).then(r => {
      window.__testResult = r;
      document.title = `${r.fail === 0 ? 'PASS' : 'FAIL'} ${r.pass}/${r.pass + r.fail}`;
    });
  </script>
</body>
</html>
